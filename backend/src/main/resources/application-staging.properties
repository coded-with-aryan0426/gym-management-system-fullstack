# ===========================================
# Staging Profile Configuration
# ===========================================
# Activate with: --spring.profiles.active=staging
# or set SPRING_PROFILES_ACTIVE=staging

# ==========================================
# DATABASE CONFIGURATION (Staging Schema)
# ==========================================
# Override these via environment variables for security
spring.datasource.url=${STAGING_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREE}
spring.datasource.username=${STAGING_DB_USERNAME:gym_staging}
spring.datasource.password=${STAGING_DB_PASSWORD:StagingPassword123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA / Hibernate
# ==========================================
# Validate schema only - never auto-modify in staging
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# HIKARICP CONNECTION POOL (Staging - moderate pool)
# ==========================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=GymStagingPool

# ==========================================
# JWT CONFIGURATION
# ==========================================
# Standard 24 hours for staging
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}

# ==========================================
# DEBUG LOGGING (Enabled for staging)
# ==========================================
logging.level.root=INFO
logging.level.com.gym.management=DEBUG
logging.level.com.gym.management.security=DEBUG
logging.level.com.gym.management.service=DEBUG
logging.level.com.gym.management.controller=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# STAGING-SPECIFIC SETTINGS
# ==========================================
staging.mode=true
staging.debug.enabled=true

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ==========================================
# ACTUATOR (Enabled for monitoring in staging)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when_authorized
