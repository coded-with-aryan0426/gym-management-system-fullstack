# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# =============================================
# DATABASE CONFIGURATION - POSTGRESQL (NEON)
# =============================================
spring.datasource.url=jdbc:postgresql://ep-gentle-wildflower-aehrds50-pooler.c-2.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_1tBIMCTibP6q
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.generate-ddl=true

# =============================================
# FLYWAY CONFIGURATION
# =============================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# =============================================
# JWT CONFIGURATION
# =============================================
jwt.secret=9a4f2c8d3b7a1e6f4c5d2b3a4f5e6d7c8b9a0e1f2c3d4e5f6a7b8c9d0e1f2a3b
jwt.expiration=86400000

# =============================================
# FILE UPLOAD CONFIGURATION
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=/tmp/uploads

# =============================================
# LOGGING CONFIGURATION
# =============================================
logging.level.org.springframework.security=INFO
logging.level.com.gym.management=INFO

# =============================================
# EMAIL / SMTP CONFIGURATION (Gmail)
# Set these in Railway environment variables:
#   SMTP_USERNAME = your.gmail@gmail.com
#   SMTP_PASSWORD = your-16-char-app-password
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:noreply@gymapp.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend URL (for email links)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
