spring.application.name=gym-management
spring.profiles.active=dev

# Import OAuth configuration
spring.config.import=optional:classpath:oauth.properties

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# Option 1: JNDI DataSource (Enterprise - Tomcat managed)
# Uncomment below for JNDI lookup when deployed to Tomcat
# spring.datasource.jndi-name=java:comp/env/jdbc/GymDB

# Option 2: Direct Connection (Development/Standalone)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREE
spring.datasource.username=system
spring.datasource.password=Oracle123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# HIKARICP CONNECTION POOL (Optimized for 1000+ concurrent sessions)
# ==========================================
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=GymManagementPool

# JPA / Hibernate for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# HIBERNATE BATCH PROCESSING (Performance Optimization)
# ==========================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Tenant Isolation - Enable Hibernate filters for automatic tenant scoping
spring.jpa.properties.hibernate.filter.enabled=true

# Flyway — enabled; migrations live in src/main/resources/db/migration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hibernate auto-create/update tables (since Flyway is disabled)
spring.jpa.hibernate.ddl-auto=update

# Server Port (for standalone mode)
server.port=8081

# ==========================================
# TOMCAT THREAD POOL (Optimized for concurrent users)
# ==========================================
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# ==========================================
# RESPONSE COMPRESSION (GZIP)
# ==========================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=user@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# APPLICATION SETTINGS
# ==========================================
server.servlet.session.timeout=30m

# Upload directory configuration
app.upload.dir=/Users/aryan/Sem 8/Intership/backend/uploads

# ==========================================
# JACKSON CONFIGURATION
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
