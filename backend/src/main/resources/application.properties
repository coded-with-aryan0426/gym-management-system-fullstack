spring.application.name=gym-management

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# Option 1: JNDI DataSource (Enterprise - Tomcat managed)
# Uncomment below for JNDI lookup when deployed to Tomcat
# spring.datasource.jndi-name=java:comp/env/jdbc/GymDB

# Option 2: Direct Connection (Development/Standalone)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREE
spring.datasource.username=system
spring.datasource.password=Oracle123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Port (for standalone mode)
server.port=8081

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=user@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# APPLICATION SETTINGS
# ==========================================
server.servlet.session.timeout=30m
