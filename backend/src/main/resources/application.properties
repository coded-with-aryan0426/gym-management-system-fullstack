spring.application.name=gym-management
spring.profiles.active=dev

# Import OAuth configuration
spring.config.import=optional:classpath:oauth.properties

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# Option 1: JNDI DataSource (Enterprise - Tomcat managed)
# Uncomment below for JNDI lookup when deployed to Tomcat
# spring.datasource.jndi-name=java:comp/env/jdbc/GymDB

# Option 2: Direct Connection (Development/Standalone)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-gentle-wildflower-aehrds50-pooler.c-2.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_1tBIMCTibP6q}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIKARICP CONNECTION POOL (Optimized for 1000+ concurrent sessions)
# ==========================================
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=GymManagementPool

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Flyway temporarily to avoid schema migration issues
spring.flyway.enabled=false

# Server Port (for standalone mode)
server.port=8081

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=user@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# APPLICATION SETTINGS
# ==========================================
server.servlet.session.timeout=30m

# Upload directory configuration
app.upload.dir=/Users/aryan/Intership/backend/uploads

# ==========================================
# JACKSON CONFIGURATION
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c5d2b3a4f5e6d7c8b9a0e1f2c3d4e5f6a7b8c9d0e1f2a3b}
