spring.application.name=gym-management

# Import OAuth configuration
spring.config.import=optional:classpath:oauth.properties

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

# --- DEVELOPMENT (H2) ---
spring.datasource.url=jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- PRODUCTION (Oracle) - Commented out for Dev ---
# spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREE
# spring.datasource.username=system
# spring.datasource.password=Oracle123
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# JPA / Hibernate
# Use 'update' for H2 dev to auto-create tables if Flyway isn't perfect for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================
# Disable Flyway for H2 Dev if scripts are Oracle-specific
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=0
# spring.flyway.locations=classpath:db/migration

# Server Port
server.port=8081

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=user@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# APPLICATION SETTINGS
# ==========================================
server.servlet.session.timeout=30m
