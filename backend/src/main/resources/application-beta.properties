# ===========================================
# Beta Profile Configuration
# ===========================================
# Activate with: --spring.profiles.active=beta
# or set SPRING_PROFILES_ACTIVE=beta

# ==========================================
# DATABASE CONFIGURATION (Beta Schema)
# ==========================================
# Override these via environment variables for security
spring.datasource.url=${BETA_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREE}
spring.datasource.username=${BETA_DB_USERNAME:gym_beta}
spring.datasource.password=${BETA_DB_PASSWORD:BetaPassword123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA / Hibernate
# ==========================================
# Validate schema only - never auto-modify in beta
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# HIKARICP CONNECTION POOL (Beta - smaller pool)
# ==========================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=GymBetaPool

# ==========================================
# JWT CONFIGURATION (Extended for beta testing)
# ==========================================
# 8 hours expiration for beta testers (28800 seconds)
jwt.expiration=${JWT_EXPIRATION:28800}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400}

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.gym.management=INFO
logging.level.com.gym.management.security=INFO
logging.level.org.springframework.security=WARN

# ==========================================
# BETA-SPECIFIC SETTINGS
# ==========================================
beta.version=1.0
beta.feedback.enabled=true
beta.mode=true

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
