version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:gymsecurepassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gym_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: gym-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-backend
    environment:
      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gym_management
      SPRING_DATASOURCE_USERNAME: gymuser
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:gymsecurepassword}
      
      # Redis configuration
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:your-secure-development-secret-key-must-be-at-least-256-bits}
      JWT_EXPIRATION: 86400
      JWT_REFRESH_EXPIRATION: 604800
      
      # Security configuration
      SPRING_PROFILES_ACTIVE: secure-dev
      
      # Logging
      LOGGING_LEVEL_COM_GYM_MANAGEMENT: INFO
      LOGGING_LEVEL_COM_GYM_MANAGEMENT_SECURITY: DEBUG
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend (optional - for full stack development)
  frontend:
    image: node:18-alpine
    container_name: gym-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - gym-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: gym-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: