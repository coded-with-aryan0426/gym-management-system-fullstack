services:
  # Backend Service (Spring Boot + Docker)
  - type: web
    name: gym-management-backend
    runtime: docker
    root: backend
    plan: free
    region: singapore # Optional: Choose close to users (e.g., singapore, oregon, frankfurt)
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database Credentials (Fill these in Render Dashboard)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Security & OAuth (Fill these in Render Dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email Service (Fill these in Render Dashboard)
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
